<!-- ============================================================
     CONTENT BLOCK: zengo_orange_cta
     Usage: {{content_blocks.${zengo_orange_cta}}}
     IMPORTANT: This block uses a placeholder CTA URL and headline.
     Override these in each campaign by building the CTA inline instead,
     OR pass via Liquid variables before referencing this block.

     Variables expected (set before calling this block):
       {% assign cta_headline = "Your Prediction. Your Profit." %}
       {% assign cta_subtext  = "Back your view on the markets that move you." %}
       {% assign cta_url      = "https://zengo.com/markets" %}
       {% assign cta_label    = "Start Trading" %}
     ============================================================ -->

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#fe990c;">
  <tr>
    <td align="center" style="padding:48px 24px 40px;">

      <!-- Headline -->
      <div style="font-family:Verdana,sans-serif; font-size:26px; font-weight:900; color:#101010; letter-spacing:-0.03em; line-height:1.15; max-width:480px; margin:0 auto;">
        {% if cta_headline %}{{cta_headline}}{% else %}Your Prediction. Your Profit.{% endif %}
      </div>

      <!-- Subtext -->
      {% if cta_subtext %}
      <div style="font-family:Verdana,sans-serif; font-size:14px; font-weight:500; color:rgba(16,16,16,0.70); margin:12px auto 0; max-width:400px; line-height:1.5;">
        {{cta_subtext}}
      </div>
      {% endif %}

      <!-- CTA Button -->
      <div style="margin-top:28px;">
        <a href="{% if cta_url %}{{cta_url}}{% else %}https://zengo.com{% endif %}"
           style="display:inline-block; background-color:#101010; color:#ffffff; font-family:Verdana,sans-serif; font-size:15px; font-weight:700; text-decoration:none; padding:16px 36px; border-radius:90px; letter-spacing:-0.01em;">
          {% if cta_label %}{{cta_label}}{% else %}Open Zengo{% endif %}
        </a>
      </div>

      <!-- App store row -->
      <div style="margin-top:24px;">
        <a href="https://apps.apple.com/app/zengo/id1480496128" style="display:inline-block; margin:0 6px; text-decoration:none;">
          <img src="https://etoro-production.s3.eu-west-1.amazonaws.com/e-marketing/MarketingAutomation/Zengo/appstore-badge.png"
               alt="Download on the App Store" width="120" style="display:inline-block; border:0; height:auto;" />
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.zengo.wallet" style="display:inline-block; margin:0 6px; text-decoration:none;">
          <img src="https://etoro-production.s3.eu-west-1.amazonaws.com/e-marketing/MarketingAutomation/Zengo/playstore-badge.png"
               alt="Get it on Google Play" width="120" style="display:inline-block; border:0; height:auto;" />
        </a>
      </div>

    </td>
  </tr>
</table>
